# SUCCESS CRITERIA
# ==============================================================================

success_criteria:
  
  business_metrics:
    - metric: "Merchant adoption"
      target: "100-500 active merchants within 18 months"
      measurement: "Monthly active merchants"
    
    - metric: "Return processing volume"
      target: "10,000-50,000 returns/day"
      measurement: "Daily return request count"
    
    - metric: "Approval rate"
      target: "70-80% auto-approved (low manual review rate)"
      measurement: "% of returns auto-approved vs. manual review"
    
    - metric: "Fraud detection accuracy"
      target: ">90% true positive rate, <5% false positive rate"
      measurement: "Confusion matrix on labeled fraud data"
    
    - metric: "Customer satisfaction"
      target: ">4.5/5 average rating"
      measurement: "Post-return survey (CSAT)"
    
    - metric: "Reviewer productivity"
      target: "20-30 reviews/hour per reviewer"
      measurement: "Reviews completed per reviewer per hour"

  
  technical_metrics:
    - metric: "Availability"
      target: "99.9% uptime (24/7)"
      measurement: "CloudWatch uptime monitoring"
    
    - metric: "Latency (customer-facing)"
      target: "p50 <500ms, p95 <1s, p99 <2s"
      measurement: "API Gateway latency metrics"
    
    - metric: "Latency (manual review)"
      target: "p50 <4 hours, p95 <8 hours"
      measurement: "Time from queue entry to decision"
    
    - metric: "Error rate"
      target: "<0.1% (99.9% success rate)"
      measurement: "Failed requests / total requests"
    
    - metric: "Data consistency"
      target: "100% (no data loss or corruption)"
      measurement: "Audit log validation, reconciliation reports"
    
    - metric: "Security incidents"
      target: "0 critical incidents per quarter"
      measurement: "Security incident reports"
  
  operational_metrics:
    - metric: "Deployment frequency"
      target: "Daily deployments to production"
      measurement: "CI/CD pipeline metrics"
    
    - metric: "Mean time to recovery (MTTR)"
      target: "<15 minutes for critical issues"
      measurement: "Incident response time"
    
    - metric: "Cost per request"
      target: "$0.02-0.03 at scale"
      measurement: "AWS Cost Explorer / total requests"
    
    - metric: "Test coverage"
      target: ">80% code coverage"
      measurement: "Unit + integration test coverage"


